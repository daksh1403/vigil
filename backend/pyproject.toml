[project]
name = "vigil-backend"
version = "0.1.0"
description = "VIGIL — AI-Powered AppSec & Code Security Platform (backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.0",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1,<4.3",
    "pyjwt>=2.8",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.2",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
    "ollama>=0.3",
    "sarif-tools>=0.0.4",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "prometheus-client>=0.20",
    "psutil>=5.9",
]

[project.optional-dependencies]
ai = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-redis",
    "watchdog>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "PL"]
ignore = ["E501", "PLR0913", "PLR2004", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/api/*" = ["B008"]
"tests/*" = ["N", "PL"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
