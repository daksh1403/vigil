# Development overrides: hot reload, mounted source, debug.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENV: development
      LOG_LEVEL: DEBUG

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend:/app
    command: watchmedo auto-restart --directory=/app --pattern=*.py --recursive -- celery -A app.workers.celery_app worker -l info -Q scans,triage,default
    environment:
      ENV: development
      LOG_LEVEL: DEBUG

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
